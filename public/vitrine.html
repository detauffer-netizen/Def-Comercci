<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f3a">
<title>Vitrine | Def Commerce</title>
<meta name="description" content="Catálogo digital com pedidos pelo WhatsApp.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/vitrine.css">
<script src="/js/vitrine.js" type="module"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" hidden>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 10h6M9 13h4"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1 6.3L12 17.4 6.5 20.4l1-6.3L3 9.7l6.2-.9z"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
</svg>

<header class="shop-hero" id="hero">
  <div class="shop-banner" id="banner"></div>
  <div class="shop-id">
    <span class="shop-logo" id="logo"></span>
    <div class="shop-title">
      <h1 id="store-name">Carregando vitrine...</h1>
      <p id="store-description" class="muted"></p>
    </div>
    <button class="btn btn-ghost btn-icon share-btn" id="share-store" aria-label="Compartilhar vitrine" hidden><svg class="icon"><use href="#i-share"/></svg></button>
  </div>
</header>

<main class="shop" id="shop" aria-busy="true">
  <div class="shop-tools">
    <label class="search"><svg class="icon"><use href="#i-search"/></svg><span class="sr-only">Buscar produto</span><input id="search" type="search" placeholder="Buscar produto" autocomplete="off"></label>
    <div class="chips" id="categories" aria-label="Categorias"></div>
  </div>
  <section id="featured-section" hidden>
    <h2 class="section-title"><svg class="icon"><use href="#i-star"/></svg>Destaques</h2>
    <div class="products featured" id="featured"></div>
  </section>
  <section>
    <h2 class="section-title" id="all-title">Produtos</h2>
    <div class="products" id="products"></div>
  </section>
  <p id="error" class="empty" hidden></p>
</main>

<footer class="shop-footer"><a href="/" class="brand"><span class="brand-mark">D</span>Criado com Def Commerce</a></footer>

<button class="cart-bar" id="cart-bar" hidden>
  <span class="cart-count" id="cart-count">0</span>
  <span>Ver pedido</span>
  <strong id="cart-total">R$ 0,00</strong>
</button>

<dialog id="product-dialog" aria-labelledby="pd-name">
  <div class="dialog-head"><span></span><button class="btn btn-ghost btn-icon" data-close aria-label="Fechar"><svg class="icon"><use href="#i-x"/></svg></button></div>
  <div class="dialog-body">
    <div class="gallery" id="pd-gallery"></div>
    <h2 id="pd-name"></h2>
    <p class="pd-price" id="pd-price"></p>
    <div id="pd-variants" class="variant-chips" role="radiogroup" aria-label="Escolha uma opção" hidden></div>
    <p id="pd-description" class="pd-description"></p>
    <p class="muted" id="pd-meta"></p>
  </div>
  <div class="dialog-foot">
    <button class="btn btn-ghost" id="pd-share" aria-label="Compartilhar produto"><svg class="icon icon-sm"><use href="#i-share"/></svg><span class="hide-xs">Compartilhar</span></button>
    <span class="spacer"></span>
    <button class="btn btn-primary" id="pd-add"><svg class="icon icon-sm"><use href="#i-plus"/></svg>Adicionar ao pedido</button>
  </div>
</dialog>

<dialog id="cart-dialog" aria-labelledby="cart-title">
  <form id="checkout" method="dialog" novalidate>
    <div class="dialog-head"><h2 id="cart-title">Seu pedido</h2><button type="button" class="btn btn-ghost btn-icon" data-close aria-label="Fechar"><svg class="icon"><use href="#i-x"/></svg></button></div>
    <div class="dialog-body">
      <div id="cart-items"></div>
      <div class="cart-sum"><span>Total</span><strong id="cart-sum">R$ 0,00</strong></div>
      <h3>Seus dados</h3>
      <label class="field"><span>Nome</span><input name="customer_name" maxlength="100" autocomplete="name" required></label>
      <label class="field"><span>Telefone / WhatsApp</span><input name="customer_phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(54) 99999-9999" required></label>
      <label class="field"><span>Observações</span><textarea name="notes" maxlength="500" placeholder="Endereço de entrega, tamanho, forma de pagamento..."></textarea></label>
      <small class="muted">Seu nome e telefone são enviados apenas para esta loja, para atender o pedido.</small>
      <p id="checkout-error" class="form-error" role="alert" hidden></p>
    </div>
    <div class="dialog-foot">
      <button class="btn btn-primary btn-block" id="send-order"><svg class="icon"><use href="#i-chat"/></svg>Enviar pedido pelo WhatsApp</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
