name = "def-commerce"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Arquivos estáticos (páginas, CSS, JS). O Worker roda primeiro em todas as
# rotas para aplicar os cabeçalhos de segurança e o roteamento das vitrines.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "def-commerce-db"
database_id = "0c35664f-97c3-4687-9861-0f1a7115207f"
migrations_dir = "migrations"

# Imagens de produtos, logotipos e banners.
# Ative depois de criar o bucket:  npx wrangler r2 bucket create def-commerce-images
# Sem este binding, o restante da plataforma funciona e o upload responde 503.
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "def-commerce-images"

[observability]
enabled = true
