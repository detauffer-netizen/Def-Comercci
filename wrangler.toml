name = "def-commerce"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
# Conta Cloudflare "Detauffer" (o ID da conta não é segredo). Com ele, a
# publicação só precisa do segredo CLOUDFLARE_API_TOKEN.
account_id = "aadf4f618d8a2a3c8f8c6cb32641e7b9"

# Arquivos estáticos (páginas, CSS, JS). O Worker roda primeiro em todas as
# rotas para aplicar os cabeçalhos de segurança e o roteamento das vitrines.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "def-commerce-db"
database_id = "0c35664f-97c3-4687-9861-0f1a7115207f"
migrations_dir = "migrations"

# Imagens de produtos, logotipos e banners (bucket criado em 27/11/2026).
# Sem este binding, o restante da plataforma funciona e o upload responde 503.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "def-commerce-images"

# Inteligência artificial (Workers AI). 10.000 Neurons grátis por dia na conta;
# acima disso exige o plano Workers Paid. Limite por loja em AI_DAILY_LIMIT.
[ai]
binding = "AI"

[vars]
AI_DAILY_LIMIT = "30"
# Cobrança real com Mercado Pago só quando o proprietário autorizar ("true").
# Segredos (nunca no repositório):
#   npx wrangler secret put MP_ACCESS_TOKEN
#   npx wrangler secret put MP_WEBHOOK_SECRET
BILLING_ENABLED = "false"

[observability]
enabled = true
