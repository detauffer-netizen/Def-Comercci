name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificações do frontend
        run: npm run check
      - name: Testes de API (unitários e integração com SQLite)
        run: npm test
      - name: Instalar navegador para E2E
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: npm run test:e2e
