name: Deploy

# Publicação manual e controlada. Exige os segredos CLOUDFLARE_API_TOKEN e
# CLOUDFLARE_ACCOUNT_ID no repositório. Faz backup do D1 antes de migrar.
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Aplicar migrações pendentes do D1"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run check
      - run: npm test
      - name: Backup do banco antes da publicação
        run: mkdir -p backups && npx wrangler d1 export def-commerce-db --remote --output=backups/pre-deploy-${{ github.run_id }}.sql
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
      - name: Migrações
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply def-commerce-db --remote
      - name: Publicar Worker
        run: npx wrangler deploy --message "deploy ${{ github.sha }}"
      - name: Verificar saúde
        run: |
          sleep 5
          curl -fsS https://def-commerce.detauffer.workers.dev/api/health
